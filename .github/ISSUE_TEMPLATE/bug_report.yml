name: Bug Report
about: File a bug report
title: "[Bug]: "
labels: ["bug", "triage needed"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out this template to help us understand and fix the issue.
  
  - type: input
    id: version
    attributes:
      label: PanLL Version
      description: What version of PanLL are you running?
      placeholder: e.g., v0.2.0
    validations:
      required: true
  
  - type: input
    id: os
    attributes:
      label: Operating System
      description: What OS and version are you using?
      placeholder: e.g., Ubuntu 22.04, macOS 13.4, Windows 11
    validations:
      required: true
  
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: When I [action], [unexpected behavior] happens instead of [expected behavior].
    validations:
      required: true
  
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this bug?
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
      placeholder: I expected [specific behavior].
    validations:
      required: true
  
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened?
      placeholder: Instead, [specific behavior] occurred.
    validations:
      required: true
  
  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Please paste any relevant log output.
      placeholder: """
      [Paste logs here]
      """
      render: shell
    validations:
      required: false
  
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem.
      placeholder: Drag and drop images here or describe visual issues.
    validations:
      required: false
  
  - type: dropdown
    id: component
    attributes:
      label: Affected Component
      description: Which part of PanLL is affected?
      options:
        - Core System
        - Identity Management
        - Team Collaboration
        - System Tray
        - CLI
        - API
        - Plugins
        - Storage Backends
        - UI/UX
        - Documentation
        - Other
    validations:
      required: true
  
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severe is this bug?
      options:
        - Low - Minor annoyance
        - Medium - Impacts functionality
        - High - Major functionality broken
        - Critical - System unusable
    validations:
      required: true
  
  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any other information that might help us fix this bug.
      placeholder: Configuration details, environment variables, etc.
    validations:
      required: false
  
  - type: checkboxes
    id: acknowledgments
    attributes:
      label: Acknowledgments
      description: Please confirm the following:
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: I have included all relevant information
          required: true
        - label: I am willing to help test a fix if needed
          required: false