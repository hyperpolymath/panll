# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
# Central Estate CI/CD Audit — thin caller of the canonical reusable in
# hyperpolymath/cicd-suite, in the form rsr-template-repo ships. It replaces an
# inline copy of the 26 gate steps that rollout_estate.sh had pasted in: that
# copy drifted (gates pinned at 5a10b72, three weeks stale), and it had no
# SPDX header and no top-level permissions, which failed the governance
# workflow linter.
name: Central Estate CI/CD Audit

# The called reusable declares `permissions: contents: read`; a caller must
# grant at least what the reusable declares, and this grants exactly that.
permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  estate-audit:
    # cicd-suite main (#49): the 26 gate composites at 1aa6bfb. Repin when the
    # callee is updated, to a main-reachable commit, never a PR head.
    uses: hyperpolymath/cicd-suite/.github/workflows/main-estate-audit.yml@4f5404281dd7092fa77cc18daec7237c4f1ee4ac
