# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
name: Build Validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  actions: read
  contents: read

jobs:
  # The ReScript build, the Deno test gate and the pcc panel-wiring gate were
  # removed (owner decision; #137, #148). #107 deleted the ReScript frontend
  # they built and tested, #108 deleted deno.json, and pcc scans .res files,
  # so none of them could pass or fail on anything real. They come back
  # against the AffineScript frontend under #148.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      # Default features build the GTK/WebKit-free library only; the desktop
      # shell (`--features gossamer`) is built by E2E's Rust job.
      - name: Rust cargo check gate
        run: cargo check --locked

      - name: Rust test gate
        run: cargo test --locked --lib -- --test-threads=1

      - name: Build Panel Contract Compiler
        run: cargo build --locked --release --manifest-path tools/pcc/Cargo.toml

  # Provenance model (docs/models/Provenance.tla, a PROOF-POLICY §4
  # exception recorded in PROOF-NEEDS.adoc): TLC checks that a chain
  # verifies only if it is the genuine one while either signing key is
  # uncompromised, and must find the forgery when both are.
  #
  # PROOF-POLICY §6 deviation (also recorded in PROOF-NEEDS.adoc, state
  # open): PanLL has no Guix manifest or proof container that provides TLC,
  # so the official tla2tools.jar release asset is fetched and checked
  # against the SHA-256 recorded here; the script asserts the TLC version
  # it ran.  Java is the runner image's.
  provenance-model:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      TLA2TOOLS_URL: https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
      TLA2TOOLS_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Fetch TLA+ tools v1.7.4 (pinned by digest)
        run: |
          curl -sSfL --retry 3 -o "$RUNNER_TEMP/tla2tools.jar" "$TLA2TOOLS_URL"
          echo "$TLA2TOOLS_SHA256  $RUNNER_TEMP/tla2tools.jar" | sha256sum -c -
          java -version

      - name: Model-check the provenance binding (both ways)
        run: bash scripts/check-provenance-model.sh "$RUNNER_TEMP/tla2tools.jar"

  # panel-clades ABI: every PanelClades.ABI module typechecks against
  # typed-wasm's grade kernel at its pin, and the expected rejections are
  # refused.  Idris2 publishes no binaries, so 0.8.0 is built from source,
  # fetched by the commit its v0.8.0 tag names (a tag can move; the SHA
  # cannot).
  panel-clades-abi:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    env:
      IDRIS2_COMMIT: 15a3e4e70843f7a34100f6470c04b791330788df  # v0.8.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Chez Scheme and GMP
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq chezscheme libgmp-dev

      - name: Build Idris2 0.8.0 from source
        run: |
          git init --quiet "$RUNNER_TEMP/idris2-src"
          git -C "$RUNNER_TEMP/idris2-src" fetch --quiet --depth 1 https://github.com/idris-lang/Idris2 "$IDRIS2_COMMIT"
          git -C "$RUNNER_TEMP/idris2-src" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/idris2-src" rev-parse HEAD)" = "$IDRIS2_COMMIT"
          # Local tag on the verified commit, so the Makefile reports the
          # release version (0.8.0) rather than 0.8.0-<sha>.
          git -C "$RUNNER_TEMP/idris2-src" tag v0.8.0
          make -C "$RUNNER_TEMP/idris2-src" bootstrap SCHEME=scheme -j"$(nproc)" > "$RUNNER_TEMP/idris2-build.log" 2>&1 \
            || { tail -60 "$RUNNER_TEMP/idris2-build.log"; exit 1; }
          make -C "$RUNNER_TEMP/idris2-src" install > "$RUNNER_TEMP/idris2-install.log" 2>&1 \
            || { tail -60 "$RUNNER_TEMP/idris2-install.log"; exit 1; }
          echo "$HOME/.idris2/bin" >> "$GITHUB_PATH"

      - name: panel-clades ABI
        run: bash panel-clades/scripts/check-abi.sh
