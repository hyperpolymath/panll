# SPDX-License-Identifier: PMPL-1.0-or-later
name: Build Validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions: read-all

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.4.0
        with:
          node-version: "20"

      - name: Setup Deno
        uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2
        with:
          deno-version: "2.x"

      - name: Install Linux dependencies for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: ReScript build gate
        run: npm run res:build

      - name: Deno test gate
        run: deno task test

      - name: Rust cargo check gate
        run: cargo check --manifest-path src-tauri/Cargo.toml

      - name: Rust test gate
        run: cargo test --manifest-path src-tauri/Cargo.toml -- --test-threads=1

      - name: Setup Rust toolchain for PCC
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7 # stable
        with:
          toolchain: stable

      - name: Build Panel Contract Compiler
        run: cargo build --release --manifest-path tools/pcc/Cargo.toml

      - name: Panel wiring verification gate
        run: ./tools/pcc/target/release/panll panel verify --repo-root .

