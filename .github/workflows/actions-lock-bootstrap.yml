# SPDX-License-Identifier: MPL-2.0
# TEMPORARY — removed in the same PR, in the commit that adds the lock.
#
# panll has no .github/workflows/actions.lock (Governance / Actions lockfile
# verify is red; panll is not in standards' lock-allow ledger). The lock can
# only be generated with GitHub API access, which this repository's agent
# sandbox lacks, so this job generates it with standards' canonical
# scripts/update-actions-lock.sh (gh-actions-lock v0.1.6, the version the
# governance gate pins) and prints the result to the log for the commit.
# It excludes itself: it is deleted before the lock is generated.
name: actions.lock bootstrap (temporary)

on:
  pull_request:
    paths:
      - .github/workflows/actions-lock-bootstrap.yml

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STANDARDS_SHA: ae36881b5ff4b469fb904b66542ac226a15107f3
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Generate actions.lock
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm .github/workflows/actions-lock-bootstrap.yml
          curl -fsSL "https://raw.githubusercontent.com/hyperpolymath/standards/${STANDARDS_SHA}/scripts/update-actions-lock.sh" \
            -o "$RUNNER_TEMP/update-actions-lock.sh"
          gh extension install github/gh-actions-lock --pin v0.1.6
          gh actions-lock --version || true
          bash "$RUNNER_TEMP/update-actions-lock.sh" .github/workflows
          git status --short .github/workflows
          git diff --stat -- .github/workflows

      - name: Print the result (base64 tar of .github/workflows)
        run: |
          set -euo pipefail
          sha256sum .github/workflows/actions.lock
          echo "----- BEGIN WORKFLOWS TGZ -----"
          tar -czf - .github/workflows | base64 -w 120
          echo "----- END WORKFLOWS TGZ -----"
