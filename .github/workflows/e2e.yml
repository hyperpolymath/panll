#
# PanLL — E2E pipeline
#
# Builds and tests the Gossamer desktop shell. The Deno E2E, crosscutting and
# bench jobs were removed (owner decision; #137, #148): every one of them
# imported src/**/*.res.js, which #107 deleted, through a deno.json that #108
# deleted. The bench job's `| tee` also hid its failure, so it showed green.
# They come back against the AffineScript frontend under #148.

name: E2E + Crosscutting + Bench

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'src/**'
      - 'src-gossamer/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'src-gossamer/**'
      - 'tests/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:

permissions: read-all

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gossamer-backend:
    name: Rust Backend — Build + Check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      # gossamer-rs builds libgossamer with Zig for the host CPU (no -mcpu), so
      # a target/ cache restored on a runner with another CPU model can die
      # with SIGILL. Key the cache on the CPU model.
      - name: CPU model for the cache key
        id: cpu
        run: echo "model=$(grep -m1 'model name' /proc/cpuinfo | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Rust cache
        uses: Swatinem/rust-cache@v2.9.3
        with:
          key: cpu-${{ steps.cpu.outputs.model }}

      - name: Install GTK/WebKit dev headers
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      # gossamer-rs compiles libgossamer from its Zig source and requires
      # exactly this version (bindings/rust/build.rs, SUPPORTED_ZIG).
      - name: Install Zig 0.15.2
        uses: goto-bus-stop/setup-zig@v2.2.1
        with:
          version: 0.15.2

      # The desktop shell is behind the `gossamer` feature; the library and
      # Rust CI build without it.
      - name: Build Gossamer backend
        run: cargo build --release --locked --features gossamer --bin panll-gossamer

      - name: Run Rust tests
        run: cargo test --locked --features gossamer
