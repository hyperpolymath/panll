# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
name: Mirror to Git Forges

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  mirror:
    # A manual dispatch from a feature branch has no local main ref to push.
    # Mirror only the canonical branch, as the push trigger already requires.
    if: github.ref == 'refs/heads/main'
    uses: metadatastician/standards/.github/workflows/mirror-reusable.yml@9bdf864cc7f2c8e24b4df84bf00d04158eee3ad5
    secrets:
      GITLAB_SSH_KEY: ${{ secrets.GITLAB_SSH_KEY }}
      CODEBERG_SSH_KEY: ${{ secrets.CODEBERG_SSH_KEY }}
      # Owner pause, 2026-11-06: Bitbucket, SourceHut and Disroot are off
      # pending their approved host/credential configuration. This reusable
      # skips a target whose key is not passed. Restore each named secret
      # here only after its configuration is ready; secrets are retained.
      # Gitea is off for now: vars.GITEA_HOST is unset, so the job failed on
      # every push. The reusable skips a forge whose key is not passed; add
      # GITEA_SSH_KEY back here once the host is configured.
      RADICLE_KEY: ${{ secrets.RADICLE_KEY }}
