# SPDX-License-Identifier: PMPL-1.0-or-later
#
# Tauri 2.0 backend — Rust gives us ~5 MB release binaries (vs 100+ MB for
# Electron), zero GC pauses during real-time panel updates, and fearless
# concurrency for the filesystem watcher. We evaluated Go for this layer early
# on — the error handling verbosity (`if err != nil` on every third line) and
# the lack of algebraic types made the Tauri command routing logic painful to
# maintain. Rust's `match` on Result/Option with exhaustive checking is the
# same philosophy as the ReScript frontend: the compiler catches what humans
# miss. See https://v2.tauri.app/start/

[package]
name = "panll"
version = "0.1.0"
description = "PanLL eNSAID - Environment for NeSy-Agentic Integrated Development"
authors = ["Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"]
edition = "2021"
license = "PMPL-1.0-or-later"
repository = "https://github.com/hyperpolymath/panll"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
reqwest = { version = "0.12", features = ["json", "blocking"] }
dirs = "6"
notify = { version = "7", features = ["serde"] }
notify-debouncer-mini = "0.5"
walkdir = "2"
regex = "1"
libc = "0.2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
