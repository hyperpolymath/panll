[package]
name = "panll-pcc"
version = "0.1.0"
edition = "2024"
description = "PanLL Panel Contract Compiler — constraint verifier for panel wiring"
license = "PMPL-1.0-or-later"
authors = ["Jonathan D.A. Jewell <j.d.a.jewell@open.ac.uk>"]

[[bin]]
name = "panll"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
colored = "3"
