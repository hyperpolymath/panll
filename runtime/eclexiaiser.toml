# eclexiaiser manifest — energy/carbon resource budgets
# SPDX-License-Identifier: MPL-2.0

[project]
name = "runtime"

[[functions]]
name = "stack-up"
source = "scripts/stack-up.sh"
energy-budget-mj = 20.0
carbon-budget-mg = 4.0

[carbon]
provider = "static"
region = "GB"
static-intensity = 200.0

[report]
format = "text"
include-recommendations = true
