# SPDX-License-Identifier: MPL-2.0
[package]
name = "panll-provenance"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
rust-version = "1.85"

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["std"] }
fips204 = { version = "=0.5.0", default-features = false, features = ["ml-dsa-65", "default-rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
sha3 = "0.10"

[dev-dependencies]
proptest = "1"
