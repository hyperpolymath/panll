#
# Cargo-fuzz manifest for PanLL Gossamer backend.
# Run: cargo +nightly fuzz run fuzz_json_command
# Run: cargo +nightly fuzz run fuzz_ipc_payload

[package]
name = "panll-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1"

[dependencies.panll]
path = ".."

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[[bin]]
name = "fuzz_json_command"
path = "fuzz_targets/fuzz_json_command.rs"
doc = false

[[bin]]
name = "fuzz_ipc_payload"
path = "fuzz_targets/fuzz_ipc_payload.rs"
doc = false
