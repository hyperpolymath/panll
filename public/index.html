<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PanLL - eNSAID (Environment for NeSy-Agentic Integrated Development)</title>

  <!-- Import map: resolve bare npm specifiers emitted by ReScript and Tauri -->
  <script type="importmap">
  {
    "imports": {
      "@rescript/core/":       "/node_modules/@rescript/core/",
      "@rescript/runtime/":    "/node_modules/@rescript/runtime/",
      "@tauri-apps/api/":      "/node_modules/@tauri-apps/api/",
      "@tauri-apps/plugin-dialog": "/node_modules/@tauri-apps/plugin-dialog/dist-js/index.js",
      "@tauri-apps/plugin-fs":     "/node_modules/@tauri-apps/plugin-fs/dist-js/index.js"
    }
  }
  </script>

  <!-- Compiled Tailwind CSS (built from src/styles/input.css via tailwind.config.js) -->
  <link rel="stylesheet" href="styles.css">

  <style>
    /* App mount container — not part of Tailwind, needed before stylesheet loads */
    #app {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <!-- TEA app mount point -->
  <div id="app"></div>

  <!-- Load the compiled ReScript application -->
  <script type="module">
    // Import the main application (auto-starts on import)
    import '../src/App.res.js';

    console.log('PanLL eNSAID loaded - TEA app should be mounted to #app');
  </script>

  <noscript>
    <div style="padding: 2rem; text-align: center;">
      <h1>JavaScript Required</h1>
      <p>PanLL requires JavaScript to run. Please enable JavaScript in your browser.</p>
    </div>
  </noscript>
</body>
</html>
