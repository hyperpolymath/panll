<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PanLL - eNSAID (Environment for NeSy-Agentic Integrated Development)</title>

  <!-- Tailwind CSS CDN for styling -->
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #111827; /* gray-900 */
      color: #f9fafb; /* gray-50 */
    }

    #app {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }

    /* Custom scrollbar for dark theme */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #1f2937; /* gray-800 */
    }

    ::-webkit-scrollbar-thumb {
      background: #4b5563; /* gray-600 */
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #6b7280; /* gray-500 */
    }
  </style>
</head>
<body>
  <!-- TEA app mount point -->
  <div id="app"></div>

  <!-- Load the compiled ReScript application -->
  <script type="module">
    // Import the main application (auto-starts on import)
    import '../src/App.res.js';

    console.log('PanLL eNSAID loaded - TEA app should be mounted to #app');
  </script>

  <noscript>
    <div style="padding: 2rem; text-align: center;">
      <h1>JavaScript Required</h1>
      <p>PanLL requires JavaScript to run. Please enable JavaScript in your browser.</p>
    </div>
  </noscript>
</body>
</html>
