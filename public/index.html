<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PanLL - eNSAID (Environment for NeSy-Agentic Integrated Development)</title>

  <!-- Compiled Tailwind CSS (built from src/styles/input.css via tailwind.config.js) -->
  <link rel="stylesheet" href="styles.css">

  <!-- DOMPurify: DOM-parser-based XSS sanitisation (Layer 1 of SafeDOM defence-in-depth).
       cure53/DOMPurify v3.3.2 — OWASP-recommended, handles mXSS, DOM clobbering, SVG/MathML.
       If this fails to load, SafeDOM falls back to built-in regex sanitiser (Layer 2). -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.3.2/purify.min.js"
          integrity="sha384-ZSs6LKr2GoUPDyHrN+rCQgyHL1yUyok5xMniSrgeRG7rUvA6vTmxronM1eZOfjgz"
          crossorigin="anonymous"
          referrerpolicy="no-referrer"></script>

  <style>
    /* App mount container — not part of Tailwind, needed before stylesheet loads */
    #app {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <!-- TEA app mount point -->
  <div id="app"></div>

  <!-- Tauri runtime shim: provides stub __TAURI_INTERNALS__ when running
       in browser-only mode (dev server, headless testing). All invoke/listen
       calls get clean Promise rejections instead of crashes. The real Tauri
       runtime replaces this when running as a desktop app. -->
  <script>
    if (!window.__TAURI_INTERNALS__) {
      window.__TAURI_INTERNALS__ = {
        __BROWSER_SHIM__: true,
        transformCallback: function(cb, once) {
          // Stub: register callback but it will never fire (no backend).
          var id = Math.random().toString(36).slice(2);
          window['_' + id] = cb;
          return id;
        },
        invoke: function(cmd) {
          return Promise.reject(new Error(
            'No Tauri runtime \u2014 "' + cmd + '" requires the desktop app'
          ));
        },
        metadata: { currentWindow: { label: 'browser' }, currentWebview: { label: 'browser' } }
      };
    }
  </script>

  <!-- Load the bundled ReScript application (built by scripts/bundle.ts) -->
  <script type="module" src="app.bundle.js"></script>

  <noscript>
    <div style="padding: 2rem; text-align: center;">
      <h1>JavaScript Required</h1>
      <p>PanLL requires JavaScript to run. Please enable JavaScript in your browser.</p>
    </div>
  </noscript>
</body>
</html>
